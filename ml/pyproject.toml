[project]
name = "unstuk-ml"
version = "0.1.0"
description = "Data, baselines, training and evaluation for Unstuk's decision model"
readme = "README.md"
authors = [
    { name = "Rishikesh V K", email = "rishikeshvk2001@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "cleanlab>=2.9.0",
    "huggingface-hub>=1.33.0",
    "numpy>=2.5.3",
    "onnxruntime>=1.30.0",
    "pydantic>=2.13.5",
    "scikit-learn>=1.9.1",
    "scipy>=1.18.1",
    "tokenizers>=0.23.2",
]

[project.scripts]
unstuk-validate = "unstuk_ml.validate:main"
unstuk-import-sheet = "unstuk_ml.sheet:main"
unstuk-freeze = "unstuk_ml.freeze:main"
unstuk-plan-batches = "unstuk_ml.grid:main"
unstuk-import-mobile-actions = "unstuk_ml.mobile_actions:main"
unstuk-clean = "unstuk_ml.clean:main"
unstuk-audit = "unstuk_ml.audit:main"
unstuk-state-slice = "unstuk_ml.state_slice:main"
unstuk-node-labels = "unstuk_ml.node_labels:main"
unstuk-evaluate-keywords = "unstuk_ml.baseline_report:main"
unstuk-tfidf = "unstuk_ml.tfidf_rung:main"
unstuk-encoder = "unstuk_ml.encoder_rung:main"
unstuk-zero-shot = "unstuk_ml.zero_shot:main"
unstuk-node-similarity = "unstuk_ml.node_similarity:main"
unstuk-train-decision = "unstuk_ml.decision_training:main"
unstuk-colab-train = "unstuk_ml.colab_job:main"
unstuk-fixed-head = "unstuk_ml.fixed_head_rung:main"
unstuk-decision = "unstuk_ml.decision_rung:main"
unstuk-option-wordings = "unstuk_ml.option_wordings:main"
unstuk-state-check = "unstuk_ml.state_check:main"
unstuk-decision-test = "unstuk_ml.decision_test:main"
unstuk-vague-slice = "unstuk_ml.vague_slice:main"
unstuk-oof-gate = "unstuk_ml.oof_gate:main"
unstuk-calibrated = "unstuk_ml.calibrated_rung:main"
unstuk-calibrated-test = "unstuk_ml.calibrated_test:main"
unstuk-export = "unstuk_ml.export:main"
unstuk-quantize = "unstuk_ml.quantized_rung:main"
unstuk-quantized-test = "unstuk_ml.quantized_test:main"
unstuk-token-fixture = "unstuk_ml.token_fixture:main"

[build-system]
requires = ["uv_build>=0.8.17,<0.9.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "ruff>=0.16.10",
]
train = [
    "onnx>=1.23.2",
    "onnxscript>=0.7.2",
    "torch>=2.14.1",
    "transformers>=5.18.0",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
# These ship without type information.
module = ["sklearn.*", "cleanlab.*", "scipy.*", "onnxruntime.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.uv]
default-groups = ["dev", "train"]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
