[project]
name = "unstuk-ml"
version = "0.1.0"
description = "Data, baselines, training and evaluation for Unstuk's decision model"
readme = "README.md"
authors = [
    { name = "Rishikesh V K", email = "rishikeshvk2001@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.13.5",
]

[project.scripts]
unstuk-validate = "unstuk_ml.validate:main"
unstuk-import-sheet = "unstuk_ml.sheet:main"
unstuk-freeze = "unstuk_ml.freeze:main"
unstuk-plan-batches = "unstuk_ml.grid:main"

[build-system]
requires = ["uv_build>=0.8.17,<0.9.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "ruff>=0.16.10",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
